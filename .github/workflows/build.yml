name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/gameboost/lite app/src/main/res/values
          mv MainActivity.kt OverlayService.kt VoiceService.kt Utils.kt app/src/main/java/com/gameboost/lite/
          mv AndroidManifest.xml app/src/main/
          mv styles.xml app/src/main/res/values/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameBoostLite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
